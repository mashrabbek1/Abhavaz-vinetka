<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />

    <title>Vinetka foto suratlar — Abhavaz</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0d0d;
        --panel: #171717;
        --line: rgba(255, 255, 255, 0.12);
        --text: #f3f3f3;
        --muted: #b8b8b8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #0b0b0b 0%, #131313 100%);
        color: var(--text);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .container {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid var(--line);
        background: rgba(12, 12, 12, 0.9);
        backdrop-filter: blur(14px);
      }

      .nav {
        min-height: 68px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .brand-mark {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
      }

      .back-link {
        padding: 11px 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        transition: background 0.2s ease, color 0.2s ease;
      }

      .back-link:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.08);
      }

      .page-links {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      main {
        padding: 68px 0 80px;
      }

      .page-heading {
        margin-bottom: 28px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2.2rem, 5vw, 3.4rem);
        letter-spacing: -0.05em;
      }

      .page-heading p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .work-gallery {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
      }

      .work-item {
        display: block;
        overflow: hidden;
        aspect-ratio: 1 / 1;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--panel);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }

      .work-item:hover {
        transform: translateY(-4px);
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
      }

      .work-item img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      @media (max-width: 800px) {
        .work-gallery {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 14px;
        }

        main {
          padding-top: 48px;
        }
      }

      @media (max-width: 480px) {
        .work-gallery {
          grid-template-columns: 1fr;
        }

        .work-item {
          aspect-ratio: 4 / 3;
        }

        .brand {
          font-size: 0.9rem;
        }

        .page-links {
          gap: 6px;
        }

        .back-link {
          padding: 10px 12px;
          font-size: 0.9rem;
        }
      }
    </style>
  </head>
