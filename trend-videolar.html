<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d0d" />
    <title>Trend videolar вЂ” Abhavaz</title>
    <style>
      :root {
        color-scheme: dark;
        --line: rgba(255, 255, 255, 0.12);
        --text: #f3f3f3;
        --muted: #b8b8b8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: #0b0b0b;
        color: var(--text);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
          linear-gradient(rgba(7, 9, 12, 0.68), rgba(7, 9, 12, 0.76)),
          url("abhavaz-portrait.jpg") center 35% / cover no-repeat;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .container {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid var(--line);
        background: rgba(12, 12, 12, 0.9);
        backdrop-filter: blur(14px);
      }

      .nav {
        min-height: 68px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .brand-mark {
        width: 38px;
        height: 38px;
        display: block;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: #171717;
      }

      .brand-mark img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 30%;
      }

      .page-links {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .page-link {
        padding: 11px 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        transition: background 0.2s ease, color 0.2s ease;
      }

      .page-link:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.08);
      }

      main {
        padding: 68px 0 80px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2.2rem, 5vw, 3.4rem);
        letter-spacing: -0.05em;
      }

      .intro {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .video-gallery {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
        margin-top: 30px;
      }

      .video-card {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.03);
      }

      .video-card video {
        display: block;
        width: 100%;
        max-height: 640px;
        aspect-ratio: 9 / 16;
        background: #050505;
        object-fit: contain;
      }

      @media (max-width: 700px) {
        .video-gallery {
          grid-template-columns: 1fr;
          gap: 16px;
        }

        .video-card video {
          max-height: 72vh;
        }
      }

      @media (max-width: 480px) {
        .nav {
          flex-wrap: wrap;
          padding: 10px 0;
        }

        .page-links {
          width: 100%;
          flex-wrap: wrap;
          justify-content: flex-start;
          gap: 6px;
        }

        .page-link {
          padding: 10px 12px;
          font-size: 0.85rem;
        }

        .brand {
          font-size: 0.9rem;
        }

        main {
          padding-top: 48px;
        }
      }
    </style>
  </head>
